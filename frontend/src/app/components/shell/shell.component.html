<div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed()" [attr.data-theme]="theme()">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="mobile-topbar">
    <button
      type="button"
      class="mobile-brand"
      aria-label="Toggle navigation"
      (click)="mobileNavOpen.update(open => !open)"
    >
      <img class="brand-mark" src="/rims-mark.svg" alt="" />
      <span>RIMS</span>
    </button>
    <button
      #mobileMenuButton
      type="button"
      class="mobile-menu-button"
      [attr.aria-expanded]="mobileNavOpen()"
      aria-controls="primary-navigation"
      [attr.aria-label]="mobileNavOpen() ? 'Close navigation' : 'Open navigation'"
      (click)="mobileNavOpen.update(open => !open)"
    >
      <i [class]="mobileNavOpen() ? 'ri-close-line' : 'ri-menu-line'" aria-hidden="true"></i>
    </button>
  </header>

  <button
    *ngIf="mobileNavOpen()"
    type="button"
    class="mobile-nav-backdrop"
    aria-label="Close navigation"
    tabindex="-1"
    (click)="closeMobileNav()"
  ></button>

  <aside
    id="primary-navigation"
    class="app-sidebar"
    [class.mobile-open]="mobileNavOpen()"
  >
    <div class="sidebar-top-row">
      <button
        type="button"
        class="sidebar-brand-btn"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="!sidebarCollapsed()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [title]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      >
        <img class="brand-mark" src="/rims-mark.svg" alt="RIMS logo" />
        <span class="brand-copy">
          <strong>RIMS</strong>
          <span>HCLTech</span>
        </span>
      </button>
      <button type="button" class="sidebar-close" aria-label="Close navigation" (click)="closeMobileNav()">
        <i class="ri-close-line" aria-hidden="true"></i>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Primary navigation">
      <div class="nav-group">
        <p class="nav-heading">Workspace</p>
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Overview"
          aria-label="Overview"
        >
          <i class="ri-layout-grid-line" aria-hidden="true"></i>
          <span>Overview</span>
        </a>
        <a
          routerLink="/inventory"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Inventory"
          aria-label="Inventory"
        >
          <i class="ri-database-2-line" aria-hidden="true"></i>
          <span>Inventory</span>
        </a>
        <a
          routerLink="/products"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Products"
          aria-label="Products"
        >
          <i class="ri-box-3-line" aria-hidden="true"></i>
          <span>Products</span>
        </a>
        <a
          routerLink="/warehouses"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Warehouses"
          aria-label="Warehouses"
        >
          <i class="ri-building-2-line" aria-hidden="true"></i>
          <span>Warehouses</span>
        </a>
      </div>

      <div class="nav-group">
        <p class="nav-heading">Orders & activity</p>
        <a
          *ngIf="authService.isWarehouseManager()"
          routerLink="/purchase-orders"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Purchase orders"
          aria-label="Purchase orders"
        >
          <i class="ri-truck-line" aria-hidden="true"></i>
          <span>Purchase orders</span>
        </a>
        <a
          routerLink="/customer-orders"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Customer orders"
          aria-label="Customer orders"
        >
          <i class="ri-shopping-bag-3-line" aria-hidden="true"></i>
          <span>Customer orders</span>
        </a>
        <a
          routerLink="/stock-movements"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Stock movements"
          aria-label="Stock movements"
        >
          <i class="ri-arrow-left-right-line" aria-hidden="true"></i>
          <span>Stock movements</span>
        </a>
        <a
          routerLink="/suppliers"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Suppliers"
          aria-label="Suppliers"
        >
          <i class="ri-team-line" aria-hidden="true"></i>
          <span>Suppliers</span>
        </a>
        <a
          *ngIf="authService.isAdmin()"
          routerLink="/users"
          routerLinkActive="active"
          class="nav-link"
          (click)="onNavClick()"
          title="Users"
          aria-label="Users"
        >
          <i class="ri-user-settings-line" aria-hidden="true"></i>
          <span>Users</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [title]="theme() === 'dark' ? 'Light appearance' : 'Dark appearance'"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light appearance' : 'Switch to dark appearance'"
      >
        <i [class]="theme() === 'dark' ? 'ri-sun-line' : 'ri-moon-line'" aria-hidden="true"></i>
        <span>{{ theme() === 'dark' ? 'Light appearance' : 'Dark appearance' }}</span>
      </button>
      <div class="user-profile">
        <span class="profile-avatar" aria-hidden="true" [title]="authService.currentUser()?.username || 'User'">{{ userInitials }}</span>
        <span class="profile-details">
          <strong>{{ authService.currentUser()?.username || 'User' }}</strong>
          <span>{{ userRoleLabel }}</span>
        </span>
        <button
          type="button"
          class="sign-out-button"
          aria-label="Sign out"
          title="Sign out"
          (click)="authService.logout()"
        >
          <i class="ri-logout-box-r-line" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </aside>

  <main id="main-content" class="app-main" tabindex="-1" [attr.inert]="mobileNavOpen() ? '' : null">
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
