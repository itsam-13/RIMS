server:
  port: ${PORT:8082}

spring:
  application:
    name: inventory
  config:
    import:
      - "optional:classpath:application-local.yaml"
      - "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  bootstrap:
    super-admin:
      username: ${SUPER_ADMIN_USERNAME:}
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
