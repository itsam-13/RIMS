server:
  port: ${PORT:8082}

spring:
  application:
    name: inventory
  config:
    import:
      - "optional:classpath:application-local.yaml"
      - "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:postgres}
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:temporary_dev_secret_key_change_in_production_min_256_bits}
  expiration-ms: 86400000
